version: '3.8'

services:
  vibevoice-asr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relais-vibevoice-bitnet
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VIBEVOICE_MODEL_PATH=/app/models/vibevoice-asr-bitnet-b1.58
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - MAX_AUDIO_BUFFER_SECONDS=300
    volumes:
      - ./models:/app/models:ro
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1G
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: relais-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
